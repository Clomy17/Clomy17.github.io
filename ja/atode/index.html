				<script>
					const rotate = (p, k, c) => {
						for (let i = 0; i < k; i++) p = { u: -p.v, v: p.u + c * p.v };
						return p;
					};
					const inverseRotate = (p, k, c) => {
						for (let i = 0; i < k; i++) p = { u: p.v + c * p.u, v: -p.u };
						return p;
					};
					const clamp = x => Math.max(-0.5 + 1e-8, Math.min(1.5 - 1e-8, x));
					const frac = x => x - Math.floor(x);
					
					for (const svg of document.querySelectorAll('svg.orbifold:not([data-n="2"])')) {
						const N = Number(svg.dataset.n);
						const c = { 3: -1, 4: 0, 6: 1 }[N];
						const lattice = svg.querySelector('.lattice');
						const circles = [...svg.querySelectorAll('.points circle')];
						let z = { 3: {u: 1/4, v: 1/6}, 4: {u: 1/4, v: 1/8}, 6: {u: 1/4, v: 1/8} }[N];
						let drag = null;
					
						const position = el => {
							const q = rotate(z, Number(el.dataset.k), c);
							return {
								u: frac(q.u) + Number(el.dataset.m),
								v: frac(q.v) + Number(el.dataset.n)
							};
						};
						const mouseToLattice = e =>
							new DOMPoint(e.clientX, e.clientY).matrixTransform(lattice.getScreenCTM().inverse());
					
						function updatePoints() {
							const transform = svg.getScreenCTM().inverse().multiply(lattice.getScreenCTM());
							for (const el of circles) {
								const k = Number(el.dataset.k);
								const m = Number(el.dataset.m);
								const n = Number(el.dataset.n);
								const q = rotate(z, k, c);
								const p = { u: frac(q.u) + m, v: frac(q.v) + n };
								const screen = new DOMPoint(p.u, p.v).matrixTransform(transform);
								el.setAttribute('cx', screen.x);
								el.setAttribute('cy', screen.y);
							}
						}
					
						svg.addEventListener('pointerdown', e => {
							const el = e.target.closest('.points circle');
							if (!el || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
							const mouse = mouseToLattice(e);
							const p = position(el);
							drag = {
								id: e.pointerId,
								k: Number(el.dataset.k),
								m: Number(el.dataset.m),
								n: Number(el.dataset.n),
								du: p.u - mouse.x, dv: p.v - mouse.y, // クリック位置のずれ
								shiftU: Number(el.dataset.m) - Math.floor(rotate(z, Number(el.dataset.k), c).u),
								shiftV: Number(el.dataset.n) - Math.floor(rotate(z, Number(el.dataset.k), c).v)
							};
							svg.setPointerCapture(e.pointerId);
							e.preventDefault();
						});
					
						svg.addEventListener('pointermove', e => {
							if (!drag || e.pointerId !== drag.id) return;
							const mouse = mouseToLattice(e);
							const p = { u: clamp(mouse.x + drag.du), v: clamp(mouse.y + drag.dv) };
							const unwrapped = inverseRotate({ u: p.u - drag.shiftU,
																								v: p.v - drag.shiftV }, drag.k, c);
							z = { u: frac(unwrapped.u), v: frac(unwrapped.v) };
							updatePoints();
						});
					
						function endDrag(e) {
							if (drag && e.pointerId === drag.id) drag = null;
						}
						svg.addEventListener('pointerup', endDrag);
						svg.addEventListener('pointercancel', endDrag);
						svg.addEventListener('lostpointercapture', endDrag);
					updatePoints();
					}
				</script>
				<script>
					(() => {
						const figure = document.querySelector('.z2-figure');
						const svg = figure.querySelector('svg.orbifold');
						const lattice = svg.querySelector('.lattice');
						const clip = svg.querySelector('#clip2 polygon');
						const points = [...svg.querySelectorAll('.points circle')];
						const fixed = [...svg.querySelectorAll('.fixed-points circle')];
						const inputRe = figure.querySelector('.tau-re');
						const inputIm = figure.querySelector('.tau-im');
						const warning = figure.querySelector('.tau-warning');
						const frac = x => x - Math.floor(x);
						const clamp = x => Math.max(-.5 + 1e-8, Math.min(1.5 - 1e-8, x));
						let tau = { re: 0, im: 1 };
						let targetTau = { ...tau };
						let z = { u: 1/4, v: 1/8 };
						let drag = null, frame = null, debounce = null;

						const getTransform = () => {
							const scale = Math.min(330 / (2 * (1 + Math.abs(tau.re))), 260 / (2 * tau.im));
							return {
								a: scale, c: scale * tau.re, d: -scale * tau.im,
								e: 210 - scale * (1 + tau.re) / 2,
								f: 170 + scale * tau.im / 2
							};
						};

						function update() {
							const t = getTransform();
							const project = (u, v) => ({ x: t.a * u + t.c * v + t.e, y: t.d * v + t.f });
							const place = (el, u, v) => {
								const p = project(u, v);
								el.setAttribute('cx', p.x);
								el.setAttribute('cy', p.y);
							};
							lattice.setAttribute('transform', `matrix(${t.a} 0 ${t.c} ${t.d} ${t.e} ${t.f})`);
							clip.setAttribute('points', [[-.5,-.5],[1.5,-.5],[1.5,1.5],[-.5,1.5]]
								.map(([u,v]) => { const p = project(u,v); return `${p.x},${p.y}`; }).join(' '));
							const origin = project(0,0);
							for (const [kind, u, v] of [['one',1,0], ['tau',0,1]]) {
								const el = svg.querySelector(`[data-arrow="${kind}"]`);
								const end = project(u,v);
								el.setAttribute('x1', origin.x);
								el.setAttribute('y1', origin.y);
								el.setAttribute('x2', end.x);
								el.setAttribute('y2', end.y);
							}
							for (const [kind, u, v, dx, dy] of [['zero',0,0,-12,17], ['one',1,0,7,17], ['tau',0,1,-14,-11]]) {
								const el = svg.querySelector(`[data-label="${kind}"]`);
								const p = project(u,v);
								el.setAttribute('x',p.x + dx);
								el.setAttribute('y',p.y + dy);
							}
							for (const el of points) {
								const sign = Number(el.dataset.k) ? -1 : 1;
								place(el, frac(sign * z.u) + Number(el.dataset.m),
									frac(sign * z.v) + Number(el.dataset.n));
							}
							for (const el of fixed) place(el, Number(el.dataset.u), Number(el.dataset.v));
						}

						function animateTo(next) {
							if (frame !== null) cancelAnimationFrame(frame);
							targetTau = { ...next };
							const start = { ...tau };
							const begun = performance.now();
							const duration = 250;
							function tick(now) {
								const x = Math.min(1, Math.max(0, (now - begun) / duration));
								const ease = x * x * (3 - 2 * x);
								tau = {
									re: start.re + (next.re - start.re) * ease,
									im: start.im + (next.im - start.im) * ease
								};
								update();
								frame = x < 1 ? requestAnimationFrame(tick) : null;
							}
							frame = requestAnimationFrame(tick);
						}

						function applyInputs() {
							clearTimeout(debounce);
							const re = inputRe.valueAsNumber;
							const im = inputIm.valueAsNumber;
							if (!Number.isFinite(re) || !Number.isFinite(im) || im <= 0) {
								warning.textContent = ' > 0';
								return;
							}
							warning.textContent = '';
							if (re !== targetTau.re || im !== targetTau.im) animateTo({ re, im });
						}
						for (const input of [inputRe, inputIm]) {
							input.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(applyInputs, 300); });
							input.addEventListener('change', applyInputs);
						}

						const mouseToLattice = e =>
							new DOMPoint(e.clientX, e.clientY).matrixTransform(lattice.getScreenCTM().inverse());
						svg.addEventListener('pointerdown', e => {
							const el = e.target.closest('.points circle');
							if (!el || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
							if (frame !== null) {
								cancelAnimationFrame(frame);
								frame = null;
								tau = { ...targetTau };
								update();
							}
							const mouse = mouseToLattice(e);
							const sign = Number(el.dataset.k) ? -1 : 1;
							const m = Number(el.dataset.m), n = Number(el.dataset.n);
							const u = sign * z.u, v = sign * z.v;
							drag = {
								id: e.pointerId, sign,
								du: frac(u) + m - mouse.x, dv: frac(v) + n - mouse.y,
								shiftU: m - Math.floor(u), shiftV: n - Math.floor(v)
							};
							svg.setPointerCapture(e.pointerId);
							e.preventDefault();
						});
						svg.addEventListener('pointermove', e => {
							if (!drag || e.pointerId !== drag.id) return;
							const mouse = mouseToLattice(e);
							const u = clamp(mouse.x + drag.du) - drag.shiftU;
							const v = clamp(mouse.y + drag.dv) - drag.shiftV;
							z = { u: frac(drag.sign * u), v: frac(drag.sign * v) };
							update();
						});
						const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
						for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
							svg.addEventListener(name, endDrag);
						}
						update();
					})();
				</script>
			</section>
		</section>

		<section class="references">
			<h2>参考文献</h2>
		</section>
	</main></body>
</html>
